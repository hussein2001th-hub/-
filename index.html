<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر حسين أثير للرشق</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h1 {
            color: #FFD700;
            font-size: 24px;
        }
        .service-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .service-box h3 {
            margin: 0 0 10px 0;
            color: #FFD700;
        }
        .buy-btn {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>متجر حسين أثير</h1>
        <p id="user-greeting">جاري تحميل البيانات...</p>
    </div>

    <div class="service-box">
        <h3>رشق متابعين إنستغرام</h3>
        <p>1000 متابع - السعر: 1$</p>
        <button class="buy-btn" onclick="orderService('instagram_followers')">طلب الخدمة</button>
    </div>

    <div class="service-box">
        <h3>رشق مشاهدات تيك توك</h3>
        <p>10,000 مشاهدة - السعر: 0.5$</p>
        <button class="buy-btn" onclick="orderService('tiktok_views')">طلب الخدمة</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        if (tg.initDataUnsafe.user) {
            document.getElementById("user-greeting").innerText = "أهلاً بك يا " + tg.initDataUnsafe.user.first_name;
        }

        function orderService(serviceType) {
            tg.sendData(serviceType);
            tg.close();
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر حسين اثير</title>
    <!-- مكتبة تيليجرام لربط الواجهة بالبوت -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Tahoma, Arial, sans-serif; padding: 20px; margin: 0; }
        h2 { text-align: center; color: #0088cc; }
        p { text-align: center; color: #aaaaaa; }
        .platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .card:active { border-color: #0088cc; background-color: #2a2a2a; }
        .card h3 { margin: 0; font-size: 16px; }
        #orderSection { display: none; margin-top: 30px; background-color: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px 0; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: white; box-sizing: border-box; }
        input:focus { outline: none; border-color: #0088cc; }
        button { width: 100%; padding: 15px; background-color: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>متجر حسين اثير</h2>
    <p>اختر المنصة التي تريد رشقها:</p>

    <!-- أزرار المنصات -->
    <div class="platform-grid">
        <div class="card" onclick="openOrder('انستقرام')"><h3>📸 انستقرام</h3></div>
        <div class="card" onclick="openOrder('تليجرام')"><h3>✈️ تليجرام</h3></div>
        <div class="card" onclick="openOrder('تيك توك')"><h3>🎵 تيك توك</h3></div>
        <div class="card" onclick="openOrder('فيسبوك')"><h3>📘 فيسبوك</h3></div>
    </div>

    <!-- قسم الطلب (يظهر عند الضغط على أي منصة) -->
    <div id="orderSection">
        <h3 id="platformTitle" style="color: #0088cc; text-align: center;"></h3>
        <label>رابط الحساب أو المنشور:</label>
        <input type="text" id="linkInput" placeholder="الصق الرابط هنا...">
        <label>الكمية المطلوبة:</label>
        <input type="number" id="quantityInput" placeholder="مثال: 1000">
        <button onclick="sendOrder()">تأكيد وإرسال الطلب</button>
    </div>

    <script>
        // تفعيل الواجهة لتأخذ الشاشة كاملة
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentPlatform = "";

        // دالة لفتح قسم الطلب وتغيير العنوان حسب المنصة
        function openOrder(platformName) {
            currentPlatform = platformName;
            document.getElementById('platformTitle').innerText = "طلب رشق: " + platformName;
            document.getElementById('orderSection').style.display = "block";
            window.scrollTo(0, document.body.scrollHeight);
        }

        // دالة إرسال البيانات إلى البوت
        function sendOrder() {
            let link = document.getElementById('linkInput').value;
            let quantity = document.getElementById('quantityInput').value;

            if(link === "" || quantity === "") {
                tg.showAlert("يرجى إدخال الرابط والكمية أولاً!");
                return;
            }

            // تجهيز البيانات
            let dataToSend = {
                platform: currentPlatform,
                link: link,
                quantity: quantity
            };

            // إرسال البيانات للبوت وإغلاق الواجهة
            tg.sendData(JSON.stringify(dataToSend));
            tg.close();
        }
    </script>
</body>
</html>
